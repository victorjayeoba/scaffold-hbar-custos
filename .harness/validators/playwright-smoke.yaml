name: custos-smoke
server:
  command: yarn next:dev
  url: http://localhost:3000
  timeoutMs: 180000
defaults:
  timeoutMs: 60000
  # The keeper, trade and pool pages read testnet and the mirror node after hydration.
  hydrationTimeoutMs: 90000
  # Wallet libraries in the scaffold shell log unrelated console errors; the
  # acceptance contract checks behaviour instead.
  failOnConsoleError: false
routes:
  - name: home
    path: /
  - name: keeper
    path: /keeper
  - name: trade
    path: /trade
  - name: pool
    path: /pool
  - name: debug
    path: /debug
forbidden:
  visibleText:
    - Application error
    - Unhandled Runtime Error
    - Build Error
    - Contract not found
