name: E2E

# Builds the app and runs the Playwright smoke test (packages/nextjs/e2e):
# every route in e2e/routes.ts answers 200, shows its heading and logs no
# console errors. Playwright serves the production build itself in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build the app
        run: yarn next:build

      - name: Install Chromium
        run: yarn next:e2e:install

      - name: Run the smoke test
        run: yarn next:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/nextjs/e2e/.report
            packages/nextjs/e2e/.results
          if-no-files-found: ignore
          retention-days: 7
