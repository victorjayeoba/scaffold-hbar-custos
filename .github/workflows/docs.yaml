name: Docs and template

# Doc drift: README.md and AGENTS.md may only name contracts, files, scripts
# and routes that exist (scripts/check-docs.mjs).
# Template: template.json must pass the create-scaffold-hbar CLI's own schema,
# and its outro may only run scripts that exist (scripts/check-template.mjs).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Doc drift and template.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Doc drift
        run: node scripts/check-docs.mjs

      # template.json only exists in the template repo; the CLI removes it from scaffolded projects.
      - name: Install the latest create-scaffold-hbar CLI
        if: hashFiles('template.json') != ''
        run: npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund create-scaffold-hbar@latest

      - name: template.json against the CLI schema
        if: hashFiles('template.json') != ''
        run: node scripts/check-template.mjs "$RUNNER_TEMP/cli/node_modules/create-scaffold-hbar"
