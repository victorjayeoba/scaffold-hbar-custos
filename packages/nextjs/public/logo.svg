<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Custos">
  <defs>
    <!-- Hedera.com night gradient, top to bottom -->
    <linearGradient id="custos-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a1a"/>
      <stop offset="0.55" stop-color="#201a72"/>
      <stop offset="1" stop-color="#3d2db3"/>
    </linearGradient>
    <!-- Solid metronome body with the pendulum cut out of it -->
    <mask id="custos-body">
      <path d="M204 132H308L392 416H120Z" fill="#fff" stroke="#fff" stroke-width="32" stroke-linejoin="round"/>
      <path d="M256 352L290 118" stroke="#000" stroke-width="24" stroke-linecap="round"/>
      <circle cx="273" cy="236" r="34" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#custos-bg)"/>
  <rect width="512" height="512" fill="#fff" mask="url(#custos-body)"/>
  <!-- The arm's tip, above the body -->
  <path d="M292 100L300 46" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
</svg>
